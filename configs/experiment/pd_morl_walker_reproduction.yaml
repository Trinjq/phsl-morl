# @package _global_
# Step9.0 source-equivalent formal reproduction configuration.
# This file is a budget contract; it must not be launched during the audit.
defaults:
  - /logging
  - /env: brax/walker2d
  - /agent: mo-td3
  - _self_

seed: 1
formal_reproduction: true
source_git_commit: 5d550a772e45afa0a6fd808c06daa5ff87f9f1db
enable_jit: true
recorders: [log]
output_dir: ""
log_interval: 1000

# The official N is per logical worker and already includes the prefill.
source_worker_steps: 1000000
source_process_count: 10
source_prefill_env_transitions: 1530
expected_prefill_steps_per_worker: 153
expected_post_prefill_workflow_rounds: 999847
expected_final_worker_steps: 1000000
expected_valid_env_transitions: 10000000
expected_critic_optimizer_steps: 9998470
expected_actor_optimizer_steps: 999847
expected_target_updates: 999847
expected_total_timesteps: 10000000

workflow_cls: evorl.algorithms.mo_td3.MOTD3Workflow
matmul_precision: highest
num_envs: 10
normalize_obs: false
rollout_length: 1
discount: 0.995
total_timesteps: 10000000
fold_iters: 1
num_eval_envs: 10
eval_episodes: 3

random_timesteps: 1530
learning_start_timesteps: 1530
learner_start_replay_entries: 1536
start_timesteps: 10000
her_start_timesteps: 10000
batch_size: 256
replay_buffer_capacity: 2000000

reward_size: 2
process_count: 10
num_relabel_preferences: 3
tau: 0.005
exploration_epsilon: 0.1
policy_noise: 0.2
clip_policy_noise: 0.5
actor_update_interval: 10
actor_loss_coeff: 10
num_updates_per_iter: 1

agent_network:
  critic_hidden_layer_sizes: [400, 400]
  actor_hidden_layer_sizes: [400, 400]

optimizer:
  lr: 0.0003
  grad_clip_norm: 100

interp_artifact_path: configs/artifacts/interp_objs_walker2d_brax_v2.txt
save_replay_buffer: true
checkpoint:
  enable: true
  save_interval_steps: 100000
  max_to_keep: 2

# Match the official MuJoCo time limit in the formal budget config. The
# physics backend remains Brax and is documented as an environment adaptation.
env:
  max_episode_steps: 500
