# @package _global_

workflow_cls: evorl.algorithms.mo_td3.PDMORLWorkflow
matmul_precision: highest

num_envs: 10
normalize_obs: false
rollout_length: 1
total_timesteps: 1000000
fold_iters: 1

num_eval_envs: 10

random_timesteps: 1530
learning_start_timesteps: 1530
learner_start_threshold: 1536
random_action_warmup: 10000
her_start_timesteps: 10000
batch_size: 256
replay_capacity: 2000000

num_objectives: 2
process_count: 10
num_relabel_preferences: 3
tau: 0.005
gamma: 0.995
exploration_noise: 0.1
target_policy_noise: 0.2
noise_clip: 0.5
policy_freq: 10
actor_loss_coeff: 10
num_updates_per_iter: 1
gradient_clip_norm: 100

optimizer:
  lr: 0.0003

# Control/evaluation plane (source-faithful production values).
interpolator_artifact: configs/artifacts/interp_objs_walker2d.txt
key_update_enabled: true
eval_freq: 100
eval_episodes: 3
training_eval_preference_step: 0.005
offline_eval_preference_step: 0.001

agent_network:
  critic_hidden_layer_sizes: [400, 400]
  actor_hidden_layer_sizes: [400, 400]

save_replay_buffer: true
